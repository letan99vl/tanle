name: Build DynoTL Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/dynotl-android-source.b64"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore Android source
        run: |
          mkdir -p android-work
          base64 -d android/dynotl-android-source.b64 > android-source.zip
          unzip -q android-source.zip -d android-work
          base64 -d android-work/app/dynotl-mobile.jks.b64 > android-work/app/dynotl-mobile.jks
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-work/app/src/main/java/vn/dynotl/mobile/MainActivity.java")
          s = p.read_text()

          s = s.replace("import android.content.pm.PackageManager;\n", "import android.content.pm.PackageManager;\nimport android.graphics.Color;\n")
          s = s.replace("import android.webkit.JavascriptInterface;\n", "import android.webkit.JavascriptInterface;\nimport android.webkit.RenderProcessGoneDetail;\n")
          s = s.replace("import android.widget.Toast;\n", "import android.widget.Toast;\nimport android.widget.TextView;\nimport android.widget.ScrollView;\n")
          s = s.replace("import java.io.InputStreamReader;\n", "import java.io.InputStreamReader;\nimport java.io.StringWriter;\nimport java.io.PrintWriter;\n")

          old_oncreate = '''    @Override
              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  prefs = getSharedPreferences("dynotl", MODE_PRIVATE);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  enterImmersive();
                  getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                  bluetoothAdapter = bm != null ? bm.getAdapter() : null;

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUserAgentString(s.getUserAgentString() + " DYNOTL-MOBILE-ANDROID/1.0");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) s.setSafeBrowsingEnabled(true);

                  webView.addJavascriptInterface(new BleJsBridge(), "AndroidBLE");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          injectNativeBridge();
                      }
                  });
                  webView.loadUrl(START_URL);
              }
          '''.replace("              ","")

          new_oncreate = '''    @Override
              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("dynotl", MODE_PRIVATE);
                  installCrashRecorder();

                  showStatusScreen("DynoTL Mobile\\nStarting...");
                  getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  main.postDelayed(() -> {
                      try {
                          startWebView();
                      } catch (Throwable t) {
                          showFatal("STARTUP", t);
                      }
                  }, 250);
              }

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              private void startWebView() {
                  WebView w = new WebView(this);
                  webView = w;
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  try { s.setUserAgentString(s.getUserAgentString() + " DYNOTL-MOBILE-ANDROID/1.1-SAFE"); } catch (Throwable ignored) { }

                  w.addJavascriptInterface(new BleJsBridge(), "AndroidBLE");
                  w.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          try {
                              injectNativeBridge();
                              safeEnterImmersive();
                          } catch (Throwable t) {
                              showFatal("PAGE FINISH", t);
                          }
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          String why = "WebView renderer stopped";
                          if (detail != null) why += detail.didCrash() ? " (crash)" : " (killed by system)";
                          try {
                              view.removeJavascriptInterface("AndroidBLE");
                              view.destroy();
                          } catch (Throwable ignored) { }
                          webView = null;
                          showFatalText("WEBVIEW RENDERER", why + "\\n\\nAndroid WebView/Chrome may need updating.");
                          return true;
                      }
                  });
                  setContentView(w);
                  w.loadUrl(START_URL);
              }

              private void showStatusScreen(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.WHITE);
                  tv.setBackgroundColor(Color.rgb(8, 10, 12));
                  tv.setTextSize(18f);
                  tv.setPadding(32, 32, 32, 32);
                  setContentView(tv);
              }

              private void showFatal(String stage, Throwable t) {
                  showFatalText(stage, stackTrace(t));
              }

              private void showFatalText(String stage, String detail) {
                  try {
                      TextView tv = new TextView(this);
                      tv.setText("DynoTL Mobile diagnostic\\n\\nStage: " + stage + "\\n\\n" + detail);
                      tv.setTextColor(Color.WHITE);
                      tv.setBackgroundColor(Color.rgb(24, 6, 8));
                      tv.setTextSize(14f);
                      tv.setTextIsSelectable(true);
                      tv.setPadding(24, 24, 24, 24);
                      ScrollView sv = new ScrollView(this);
                      sv.addView(tv);
                      setContentView(sv);
                  } catch (Throwable ignored) { }
              }

              private String stackTrace(Throwable t) {
                  try {
                      StringWriter sw = new StringWriter();
                      t.printStackTrace(new PrintWriter(sw));
                      return sw.toString();
                  } catch (Throwable e) {
                      return String.valueOf(t);
                  }
              }

              private void installCrashRecorder() {
                  final Thread.UncaughtExceptionHandler old = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((thread, error) -> {
                      try {
                          getSharedPreferences("dynotl", MODE_PRIVATE).edit()
                                  .putString("lastCrash", stackTrace(error)).commit();
                      } catch (Throwable ignored) { }
                      if (old != null) old.uncaughtException(thread, error);
                  });
              }
          '''.replace("              ","")

          if old_oncreate not in s:
              raise SystemExit("onCreate block not found")
          s = s.replace(old_oncreate, new_oncreate)

          hook = "    @Override protected void onWindowFocusChanged(boolean hasFocus) {"
          helper = '''    private void safeEnterImmersive() {
                  try { enterImmersive(); } catch (Throwable ignored) { }
              }

          '''.replace("              ","")
          s = s.replace(hook, helper + "    @Override public void onWindowFocusChanged(boolean hasFocus) {")
          s = s.replace("        if (hasFocus) enterImmersive();", "        if (hasFocus) safeEnterImmersive();")

          marker = "    private boolean hasBlePermissions() {"
          bt_helper = '''    private void initBluetoothAdapter() {
                  if (bluetoothAdapter != null) return;
                  try {
                      BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                      bluetoothAdapter = bm != null ? bm.getAdapter() : null;
                  } catch (Throwable t) {
                      bluetoothAdapter = null;
                  }
              }

          '''.replace("              ","")
          s = s.replace(marker, bt_helper + marker)
          s = s.replace("    private void ensurePermissionsThenConnect(boolean auto) {\n        if (bluetoothAdapter == null) {",
                        "    private void ensurePermissionsThenConnect(boolean auto) {\n        initBluetoothAdapter();\n        if (bluetoothAdapter == null) {")
          s = s.replace("        enterImmersive();\n        main.postDelayed(this::tryAutoReconnect, 700);",
                        "        safeEnterImmersive();\n        main.postDelayed(this::tryAutoReconnect, 700);")

          p.write_text(s)

          m = Path("android-work/app/src/main/AndroidManifest.xml")
          ms = m.read_text()
          ms = ms.replace('android:screenOrientation="sensorLandscape"', 'android:screenOrientation="unspecified"')
          ms = ms.replace('android:theme="@android:style/Theme.Material.NoActionBar">',
                          'android:theme="@android:style/Theme.Material.NoActionBar"\n        android:hardwareAccelerated="true">')
          m.write_text(ms)
          PY

      - name: Build release APK
        working-directory: android-work
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp android-work/app/build/outputs/apk/release/app-release.apk DynoTL-Mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynoTL-Mobile-APK
          path: DynoTL-Mobile.apk
          if-no-files-found: error
          retention-days: 30
