name: Build DynoTL Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/dynotl-android-source.b64"
      - "android/safe_patch.py.gz.b64"
      - "android/immediate_chooser_patch.py.gz.b64"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore and patch Android source
        run: |
          mkdir -p android-work
          base64 -d android/dynotl-android-source.b64 > android-source.zip
          unzip -q android-source.zip -d android-work
          base64 -d android-work/app/dynotl-mobile.jks.b64 > android-work/app/dynotl-mobile.jks
          base64 -d android/safe_patch.py.gz.b64 | gzip -d > /tmp/patch_safe.py
          python3 /tmp/patch_safe.py
          base64 -d android/immediate_chooser_patch.py.gz.b64 | gzip -d > /tmp/patch_immediate.py
          python3 /tmp/patch_immediate.py

      - name: Build release APK
        working-directory: android-work
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp android-work/app/build/outputs/apk/release/app-release.apk DynoTL-Mobile-Safe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynoTL-Mobile-Safe-APK
          path: DynoTL-Mobile-Safe.apk
          if-no-files-found: error
          retention-days: 30
