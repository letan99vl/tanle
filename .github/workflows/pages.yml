name: Deploy BT Speed Dyno Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bt-speed-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4

      - name: Verify public runtime files
        run: |
          test -f index.html
          test -f .nojekyll
          test -f manifest.webmanifest
          test -f live/head.html
          test -f live/info.html
          test -f live/kpis.html
          test -f live/rpm.html
          test -f live/speed.html
          test -f dynotl/index.html
          test -f dynotl/manifest.webmanifest
          test -f dynotl/live/head.html
          test -f dynotl/live/info.html
          test -f dynotl/live/kpis.html
          test -f dynotl/live/rpm.html
          test -f dynotl/live/speed.html
          grep -q '<title>Dyno TL Mobile</title>' dynotl/index.html
          grep -q 'id="buildTag"' index.html
          grep -q 'id="afrSettingsLiveVoltage"' index.html

      - name: Stage runtime allowlist only
        run: |
          set -euo pipefail
          mkdir -p public-runtime/live public-runtime/dynotl/live
          cp index.html manifest.webmanifest .nojekyll public-runtime/
          cp live/head.html live/info.html live/kpis.html live/rpm.html live/speed.html public-runtime/live/
          cp dynotl/index.html dynotl/manifest.webmanifest public-runtime/dynotl/
          cp dynotl/live/head.html dynotl/live/info.html dynotl/live/kpis.html dynotl/live/rpm.html dynotl/live/speed.html public-runtime/dynotl/live/
          test ! -e public-runtime/android
          test ! -e public-runtime/firmware

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload ONLY public runtime
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-runtime

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
